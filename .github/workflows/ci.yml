name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate-compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config
        run: docker compose config --quiet

  build-test:
    name: Build & test (workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          # O repo usa npm workspaces: existe UM lockfile, na raiz.
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Prisma generate (clients-service)
        run: npx --workspace clients-service prisma generate
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  docker-build:
    name: Docker build (${{ matrix.context }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context:
          - services/clients-service
          - services/products-service
          - services/orders-service
          - frontend
    steps:
      - uses: actions/checkout@v5
      - name: docker build
        run: docker build ${{ matrix.context }}
